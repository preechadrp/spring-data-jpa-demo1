spring.datasource.url=jdbc:mariadb://localhost:3306/demojpa
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=a1234

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.auto-commit=true

# Spring SQL Initialization
spring.sql.init.mode=always

spring.jpa.hibernate.ddl-auto=create
# เปลี่ยนมาใช้ Physical Naming Strategy แบบ Standard เพื่อให้ใช้ชื่อตรงตามที่เราพิมพ์ในโค้ดเป๊ะๆ แต่มันจะมีผลกับทุก Entity เลยนะ
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
